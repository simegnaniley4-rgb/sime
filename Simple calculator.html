
<!DOCTYPE html>
<html lang="am">

<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Simple Calculator</title>
          <style>
                    * {
                              margin: 0;
                              padding: 0;
                              box-sizing: border-box;
                              font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                    }

                    body {
                              background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
                              display: flex;
                              justify-content: center;
                              align-items: center;
                              height: 100vh;
                    }

                    .calculator {
                              background-color: #121212;
                              padding: 25px;
                              border-radius: 30px;
                              box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
                              width: 350px;
                              border: 1px solid #333;
                    }

                    display {
                              width: 100%;
                              background: transparent;
                              border: none;
                              color: #ffffff;
                              font-size: 3rem;
                              text-align: right;
                              margin-bottom: 20px;
                              padding: 10px;
                              outline: none;
                    }

                    .display::placeholder {
                              color: #444;
                    }

                    .buttons {
                              display: grid;
                              grid-template-columns: repeat(4, 1fr);
                              gap: 15px;
                    }

                    button {
                              height: 70px;
                              width: 70px;
                              border-radius: 50%;
                              border: none;
                              cursor: pointer;
                              font-size: 1.5rem;
                              font-weight: 500;
                              transition: 0.3s;
                              display: flex;
                              justify-content: center;
                              align-items: center;
                    }

                    .btn-num {
                              background-color: #333;
                              color: white;
                    }

                    .btn-num:hover {
                              background-color: #444;
                    }

                    .btn-op {
                              background-color: #ff9500;
                              color: white;
                    }

                    .btn-op:hover {
                              background-color: #ffb042;
                    }

                    .btn-spec {
                              background-color: #a5a5a5;
                              color: black;
                    }

                    .btn-spec:hover {
                              background-color: #d4d4d2;
                    }

                    .btn-equal {
                              background: linear-gradient(45deg, #00c6ff, #0072ff);
                              color: white;
                              border-radius: 35px;
                              grid-column: span 1;
                    }

                    button:active {
                              transform: scale(0.9);
                    }

                    .span-2 {
                              grid-column: span 2;
                              width: 155px;
                              border-radius: 35px;
                    }
          </style>
</head>

<body>
          <div class="calculator">
                    <input type="text" id="result" class="display" placeholder="0" readonly>
                    <div class="buttons">
                              <button class="btn-spec" onclick="clearScreen()">CLR</button>
                              <button class="btn-spec" onclick="deleteChar()">DEL</button>
                              <button class="btn-op" onclick="appendValue('%')">%</button>
                              <button class="btn-op" onclick="appendValue('/')">÷</button>
                              <button class="btn-num" onclick="appendValue('7')">7</button>
                              <button class="btn-num" onclick="appendValue('8')">8</button>
                              <button class="btn-num" onclick="appendValue('9')">9</button>
                              <button class="btn-op" onclick="appendValue('*')">×</button>
                              <button class="btn-num" onclick="appendValue('4')">4</button>
                              <button class="btn-num" onclick="appendValue('5')">5</button>
                              <button class="btn-num" onclick="appendValue('6')">6</button>
                              <button class="btn-op" onclick="appendValue('-')">-</button>
                              <button class="btn-num" onclick="appendValue('1')">1</button>
                              <button class="btn-num" onclick="appendValue('2')">2</button>
                              <button class="btn-num" onclick="appendValue('3')">3</button>
                              <button class="btn-op" onclick="appendValue('+')">+</button>
                              <button class="btn-num span-2" onclick="appendValue('0')">0</button>
                              <button class="btn-num" onclick="appendValue('.')">.</button>
                              <button class="btn-equal" onclick="calculate()">=</button>
                    </div>
          </div>
          <script>
                    const display = document.getElementById('result');
                    function appendValue(value) {
                              display.value += value;
                    }
                    function clearScreen() {
                              display.value = '';
                    }
                    function deleteChar() {
                              display.value = display.value.slice(0, -1);
                    }
                    function calculate() {
                              try {
                                        display.value = eval(display.value);
                              } catch (error) {
                                        display.value = "error!";
                                        setTimeout(clearScreen, 1500);
                              }
                    }
          </script>
</body>

</html>
